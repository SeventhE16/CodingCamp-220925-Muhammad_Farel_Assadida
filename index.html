<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depot Kayu Kembang Jaya</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="container nav-wrapper">
        <div class="logo">
            <img src="assets/Depotkayu.jpg" alt="Logo">
            <span>Depot Kayu</span>
        </div>

        <nav>
            <ul>
                <li><a href="#home">Beranda</a></li>
                <li><a href="#produk">Produk</a></li>
                <li><a href="#kontak">Kontak</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>

<section id="home" class="hero">
    <div class="container hero-content">
        <div class="hero-text">
            <h1>Depot Kayu Kembang Jaya</h1>
            <p>
                Menyediakan berbagai jenis kayu berkualitas untuk kebutuhan konstruksi Anda.
            </p>
            <a href="https://wa.me/6281237965000" class="btn">Order Sekarang</a>
        </div>

        <img src="assets/gambardepan.jpg" alt="Depot Kayu">
    </div>
</section>

<section id="produk" class="produk">
    <div class="container">
        <h2>Produk Unggulan</h2>

        <div class="product-grid">

            <div class="card">
                <img src="assets/kayuglugu.jpg" alt="Kayu Glugu">
                <h3>Kayu Glugu</h3>
            </div>

            <div class="card">
                <img src="assets/kayumahoni.jpg" alt="Kayu Mahoni">
                <h3>Kayu Mahoni</h3>
            </div>

            <div class="card">
                <img src="assets/kayusengon.jpg" alt="Kayu Sengon">
                <h3>Kayu Sengon</h3>
            </div>

        </div>
    </div>
</section>

<section id="kontak" class="kontak">
    <div class="container">
        <h2>Hubungi Kami</h2>

        <form onsubmit="return validateForm()">
            <input type="text" id="name" placeholder="Nama">
            <input type="email" id="email" placeholder="Email">
            <textarea id="message" placeholder="Pesan"></textarea>
            <button type="submit">Kirim</button>
        </form>
    </div>
</section>

</main>

<footer>
    <p>© 2025 Depot Kayu Kembang Jaya</p>
</footer>

<script>
function validateForm() {
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let message = document.getElementById("message").value;

    if (!name || !email || !message) {
        alert("Isi semua field dulu bro");
        return false;
    }

    alert("Pesan berhasil dikirim!");
    return true;
}
</script>

</body>
</html>
