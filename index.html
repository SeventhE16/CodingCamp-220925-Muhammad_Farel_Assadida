<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Depot Kayu Kembang Jaya</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#home">
      <img src="assets/Depotkayu.jpg" width="40" height="40" class="rounded-circle" alt="Logo Depot Kayu">
      Depot Kayu
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#home">Beranda</a></li>
        <li class="nav-item"><a class="nav-link" href="#produk">Produk</a></li>
        <li class="nav-item"><a class="nav-link" href="#kontak">Kontak</a></li>
      </ul>
    </div>
  </div>
</nav>

<section id="home" class="py-5 bg-light">
  <div class="container">
    <div class="row align-items-center g-4">
      <div class="col-md-6">
        <h1 class="display-6 fw-bold">Depot Kayu Kembang Jaya</h1>
        <p class="lead">Menyediakan berbagai jenis kayu berkualitas untuk kebutuhan konstruksi Anda.</p>
        <p id="username" class="text-muted mb-3"></p>
        <a href="https://wa.me/6281237965000" class="btn btn-warning fw-semibold">Order Sekarang</a>
      </div>

      <div class="col-md-6">
        <img src="assets/gambardepan.jpg" class="img-fluid rounded shadow-sm" alt="Tampilan depan Depot Kayu">
      </div>
    </div>
  </div>
</section>

<section id="produk" class="py-5">
  <div class="container text-center">
    <h2 class="mb-4">Produk Unggulan</h2>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0">
          <img src="assets/kayuglugu.jpg" class="card-img-top" alt="Kayu Glugu">
          <div class="card-body"><h5 class="card-title">Kayu Glugu</h5></div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0">
          <img src="assets/kayumahoni.jpg" class="card-img-top" alt="Kayu Mahoni">
          <div class="card-body"><h5 class="card-title">Kayu Mahoni</h5></div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0">
          <img src="assets/kayusengon.jpg" class="card-img-top" alt="Kayu Sengon">
          <div class="card-body"><h5 class="card-title">Kayu Sengon</h5></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="kontak" class="py-5 bg-light">
  <div class="container">
    <h2 class="text-center mb-4">Hubungi Kami</h2>

    <form id="contact-form" onsubmit="return validateForm()" class="mx-auto" style="max-width: 500px;">
      <div class="mb-3">
        <input type="text" id="name" class="form-control" placeholder="Nama">
      </div>
      <div class="mb-3">
        <input type="email" id="email" class="form-control" placeholder="Email">
      </div>
      <div class="mb-3">
        <textarea id="message" class="form-control" rows="4" placeholder="Pesan"></textarea>
      </div>
      <button type="submit" class="btn btn-dark w-100">Kirim</button>
    </form>
  </div>
</section>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">© 2026 Depot Kayu Kembang Jaya</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
